{% set section = "extension" %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献引用溯源 - 政府数据开放研究</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #2563eb;
            --accent: #7c3aed;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); 
            color: var(--text); 
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 12px; opacity: 0.85; margin: 4px 0 0 0; }
        .header .badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        
        /* Search */
        .search-section {
            background: white;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 88px;
            z-index: 99;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .stats-badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            background: #eff6ff;
            color: var(--primary);
            white-space: nowrap;
        }
        
        /* Paper Cards */
        .content { padding: 24px 40px; max-width: 1200px; }
        .card-grid { display: grid; gap: 16px; }
        
        .paper-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .paper-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 4px 16px rgba(37,99,235,0.1);
            transform: translateY(-2px);
        }
        .paper-card .index {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 11px;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .paper-card .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .paper-card .meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .paper-card .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        
        /* Loading */
        .loading { text-align: center; padding: 40px; color: var(--text-light); }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header, .search-section, .content { padding-left: 16px; padding-right: 16px; }
            .search-section { flex-direction: column; }
            .paper-card .meta { flex-direction: column; gap: 4px; }
        }
    </style>
</head>

        function renderPapers(papers) {
            const grid = document.getElementById('papersGrid');
            const empty = document.getElementById('emptyState');
            
            if (papers.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            grid.innerHTML = papers.map((paper, idx) => {
                const title = paper.title || paper.file_name.replace('.pdf', '').replace(/_/g, ' ');
                const author = paper.author || '未知';
                const pages = paper.pages ? paper.pages + ' 页' : '';
                const preview = paper.first_page_text ? 
                    paper.first_page_text.substring(0, 120).replace(/
/g, ' ') + '...' : 
                    '（点击查看完整引用信息）';
                
                return `
                <div class="paper-card" onclick="showDetail(${idx})" title="点击查看详情">
                    <span class="index">#${idx + 1}</span>
                    <div class="title">${escapeHtml(title)}</div>
                    <div class="meta">
                        <span><i class="bi bi-person"></i> ${escapeHtml(author)}</span>
                        ${pages ? '<span><i class="bi bi-file-earmark"></i> ' + pages + '</span>' : ''}
                        <span style="color:#94a3b8"><i class="bi bi-file-pdf"></i> ${escapeHtml(paper.file_name)}</span>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('statsBadge').textContent = 
                '显示 ' + papers.length + ' / 共 ' + papersData.length + ' 篇';
        }
        
        function showDetail(idx) {
            const paper = papersData[idx];
            const title = paper.title || paper.file_name.replace('.pdf', '').replace(/_/g, ' ');
            
            alert(
                '📄 文献详情\n\n' +
                '标题：' + title + '\n' +
                '文件：' + paper.file_name + '\n' +
                '页数：' + (paper.pages || '未知') + '\n' +
                '作者：' + (paper.author || '未知') + '\n\n' +
                '📌 此文献为博士论文参考文献，原始PDF文件可溯源。'
            );
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            
            if (!keyword) {
                renderPapers(papersData);
                return;
            }
            
            const filtered = papersData.filter(p => 
                (p.title && p.title.toLowerCase().includes(keyword)) ||
                (p.author && p.author.toLowerCase().includes(keyword)) ||
                (p.file_name && p.file_name.toLowerCase().includes(keyword)) ||
                (p.subject && p.subject.toLowerCase().includes(keyword)) ||
                (p.first_page_text && p.first_page_text.toLowerCase().includes(keyword))
            );
            renderPapers(filtered);
        });
