server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Thesis chart images - long cache
    location /static/thesis_charts_v7/ {
        alias /opt/ogd-collector-pro/static/thesis_charts_v7/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PDF files - 7 day cache, no access log
    location /static/fulltext/ {
        alias /opt/ogd-collector-pro/static/fulltext/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Other static files
    location /static {
        alias /opt/ogd-collector-pro/static;
        expires 7d;
    }
}
